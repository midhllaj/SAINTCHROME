<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>SAINTCHROME — Model Lab (dev only)</title>
  <style>
    html, body { margin: 0; background: #000; color: #ddd; font: 12px/1.4 ui-monospace, monospace; }
    .gl-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 20; pointer-events: none; }
    header { padding: 10px 16px; display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 30; }
    header a, header button { color: #bfe6ff; background: #111; border: 1px solid #333; padding: 4px 8px; cursor: pointer; text-decoration: none; font: inherit; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; }
    .stage { height: 72vh; border: 1px solid #222; position: relative; }
    .refs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; }
    .refs img { width: 100%; height: 34vh; object-fit: cover; }
    #log { white-space: pre-wrap; padding: 0 16px; color: #9f9; }
  </style>
</head>
<body>
  <header id="nav"></header>
  <div class="row"><div class="stage" id="stage"></div><div class="refs" id="refs"></div></div>
  <div id="log"></div>
  <script type="module" src="/src/lab.js"></script>
</body>
</html>
